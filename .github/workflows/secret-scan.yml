name: Secret Scan

on:
  push:
    branches: ["main", "develop", "release/**"]
  pull_request:
    branches: ["main", "develop"]

# Only scan the delta between base and head to keep it fast.
jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for --since-commit mode

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          # Scan only the commits introduced in this push/PR — not the full history.
          extra_args: --since-commit HEAD~1 --only-verified

  # Lightweight gitleaks scan as a second layer
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
