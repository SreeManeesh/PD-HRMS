name: Deploy HRMS to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    name: Pre-Deploy Test & Build Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run typecheck
          npm test

      - name: Verify Frontend Build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    name: Deploy to VPS
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          DEPLOY_CMD: "cd /home/deploy/PD_HRMS && git pull origin main && chmod +x deploy.sh && ./deploy.sh"
        run: |
          set -e
          # Install sshpass (password-based SSH) on the runner
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          export SSHPASS="$VPS_SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$VPS_USER@$VPS_HOST" \
            "$DEPLOY_CMD"

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          export SSHPASS="$VPS_SSH_PASSWORD"
          sleep 8
          RESP=$(sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$VPS_USER@$VPS_HOST" \
            "curl -s http://localhost:1007/api/health || true")
          echo "Health probe: $RESP"
          if ! echo "$RESP" | grep -q '"status":"ok"'; then
            echo "::error::Health check failed after deploy"
            exit 1
          fi