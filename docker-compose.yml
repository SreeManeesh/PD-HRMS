services:

  db:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms_admin
      POSTGRES_PASSWORD: hrms_password
      POSTGRES_DB: hrms_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_admin -d hrms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: hrms-api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://hrms_admin:hrms_password@db:5432/hrms_db
      # MinIO server root credentials (see `minio` service below). These MUST
      # match or every MinIO read/write fails with InvalidAccessKeyId — the
      # backend/.env values are overridden here for the api container.
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: hrms_minio
      MINIO_SECRET_KEY: hrms_minio_password
      MINIO_BUCKET: hrms-uploads
    depends_on:
      db:
        condition: service_healthy
    # Migrate-only on start: seed runs ONCE manually (never on every deploy) so
    # existing data in the hrms_pgdata volume is preserved.
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

  minio:
    image: minio/minio:latest
    container_name: hrms-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: hrms_minio
      MINIO_ROOT_PASSWORD: hrms_minio_password
    ports:
      - "127.0.0.1:1005:9000"
      - "127.0.0.1:1006:9001"
    volumes:
      - hrms_minio_data:/data
    command: server /data --console-address ":9001"

  frontend:
    image: nginx:alpine
    container_name: hrms-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:1007:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  proxy:
    image: caddy:alpine
    container_name: hrms-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend

volumes:
  hrms_pgdata:
  hrms_minio_data:
  caddy_data:
  caddy_config:
